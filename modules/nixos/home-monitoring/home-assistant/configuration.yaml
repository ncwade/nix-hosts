default_config:
homeassistant:
  name: Tycho Home
  time_zone: America/Chicago
  unit_system: us_customary
  packages: !include_dir_named packages
logger:
  default: warning
recorder:
  purge_keep_days: 10
influxdb:
  max_retries: 3
  override_measurement: home_state
  tags:
    host: tycho
  include:
    entity_globs:
      - sensor.tcc_*
    entities:
      - sensor.hp2561bu_pro_v2_1_4_indoor_temperature
      - sensor.hp2561bu_pro_v2_1_4_temperature_1
      - sensor.hp2561bu_pro_v2_1_4_wh45_temperature
      - sensor.hp2561bu_pro_v2_1_4_indoor_humidity
      - sensor.hp2561bu_pro_v2_1_4_humidity_1
      - sensor.hp2561bu_pro_v2_1_4_wh45_humidity
  ignore_attributes:
    - sampled_at
    - friendly_name
    - icon

apiVersion: 1
datasources:
  - name: Home history
    uid: home-history
    type: influxdb
    access: proxy
    url: http://127.0.0.1:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: home
      defaultBucket: home_history
      tlsSkipVerify: false
    secureJsonData:
      token: $INFLUX_READ_TOKEN
